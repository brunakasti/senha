<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset ="UFT-8">
    <title>gerador de senhas</title>
</head>
<body>
    <h1>gerador de senhas</h1>
    <label for="campo-senha">senha:</label>
    <input
     type="text"
     id="campo-senha"
     readonly>
    <br><br>
    <button onclick="diminuiTamanho()">-</button>
    <span id="numero-senha">8</span>
    <button onclick="aumentaTamanho()">+</button>
    <br><br>
    <button onclick="geraSenha()">
        Gerar nova senha
    </button>
    <script src="main.js"></script>
</body>
</html>
